[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ngaji"
dynamic = ["version"]
description = "YouTube audio player untuk terminal — dengarkan ceramah tanpa buka browser"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "rezaafaisal", email = "rezaafaisal@users.noreply.github.com" }
]
keywords = ["youtube", "audio", "cli", "terminal", "podcast", "ngaji", "ceramah"]
classifiers = [
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Topic :: Multimedia :: Sound/Audio :: Players",
]
dependencies = [
  # [default] menyertakan yt-dlp-ejs (solver JS challenge YouTube)
  "yt-dlp[default]>=2025.11.12",
  "rich>=13.0.0",
  "prompt_toolkit>=3.0.0",
]

[project.scripts]
ngaji = "ngaji.cli:main"

[project.urls]
Homepage = "https://github.com/rezaafaisal/ngaji"
Repository = "https://github.com/rezaafaisal/ngaji"
Issues = "https://github.com/rezaafaisal/ngaji/issues"

[tool.hatch.version]
path = "src/ngaji/__init__.py"

[tool.hatch.build.targets.sdist]
include = ["src/ngaji", "README.md", "LICENSE"]

[tool.hatch.build.targets.wheel]
packages = ["src/ngaji"]