name: Release

on:
  push:
    tags:
      - "v*"   # trigger saat push tag seperti v0.2.0

permissions:
  contents: write
  id-token: write   # trusted publishing PyPI (tanpa token)

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build-and-publish:
    needs: test
    runs-on: ubuntu-latest
    environment: release

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cek tag == versi package
        run: |
          VERSION=$(python -c "import re;print(re.search(r'__version__ = \"(.+)\"', open('src/ngaji/__init__.py').read()).group(1))")
          if [ "v$VERSION" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} tidak sama dengan versi v$VERSION di src/ngaji/__init__.py"
            exit 1
          fi

      - name: Build package
        run: pip install hatch && hatch build

      # Pakai trusted publishing; kalau secret PYPI_API_TOKEN di-set, token itu yang dipakai.
      - name: Publish ke PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

      - name: Buat GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
